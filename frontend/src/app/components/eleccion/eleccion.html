<div class="container py-4">
  <div class="row">
    <div class="col-12 text-center mb-4">
      <h2>Resultados Electorales 2026</h2>
    </div>
  </div>

  <div *ngIf="loading" class="text-center my-5">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Cargando...</span>
    </div>
    <p class="mt-2 text-muted">Cargando resultados electorales...</p>
  </div>

  <div *ngIf="error" class="alert alert-danger" role="alert">{{ error }}</div>

  <div *ngIf="!loading && !error" class="row">
    <div class="col-md-4 mb-4">
      <div class="card">
        <div class="card-header text-center">
          <h5 class="mb-0">Votos Nacionales</h5>
          <small class="text-muted">Voto local</small>
        </div>
        <div class="card-body chart-container">
          <canvas id="chartNacionales"></canvas>
        </div>
      </div>
    </div>
    <div class="col-md-4 mb-4">
      <div class="card">
        <div class="card-header text-center">
          <h5 class="mb-0">Votos Extranjero</h5>
          <small class="text-muted">Voto exterior</small>
        </div>
        <div class="card-body chart-container">
          <canvas id="chartExtranjero"></canvas>
        </div>
      </div>
    </div>
    <div class="col-md-4 mb-4">
      <div class="card">
        <div class="card-header text-center">
          <h5 class="mb-0">Total de Votos</h5>
          <small class="text-muted">Nacionales + Extranjero</small>
        </div>
        <div class="card-body chart-container">
          <canvas id="chartTotal"></canvas>
        </div>
      </div>
    </div>
  </div>
</div>
