<div class="container py-4">
  <div class="row">
    <div class="col-12 text-center mb-4">
      <h2>Resultados Electorales 2026</h2>
    </div>
  </div>

  <div *ngIf="loading()" class="text-center my-5">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Cargando...</span>
    </div>
    <p class="mt-2 text-muted">Cargando resultados electorales...</p>
  </div>

  <div *ngIf="error()" class="alert alert-danger" role="alert">{{ error() }}</div>

  <div *ngIf="!loading() && !error()">
    <ul class="nav nav-tabs justify-content-center mb-4">
      <li class="nav-item">
        <button class="nav-link" [class.active]="activeTab() === 'todos'" (click)="switchTab('todos')">Todos</button>
      </li>
      <li class="nav-item">
        <button class="nav-link" [class.active]="activeTab() === 'peru'" (click)="switchTab('peru')">Perú</button>
      </li>
      <li class="nav-item">
        <button class="nav-link" [class.active]="activeTab() === 'extranjero'" (click)="switchTab('extranjero')">Extranjero</button>
      </li>
    </ul>

    <div class="row justify-content-center">
      <div class="col-md-10">
        <div class="card">
          <div class="card-body">
            <div class="row">
              <div class="col-md-6">
                <div class="chart-canvas-wrapper">
                  <canvas id="chartA"></canvas>
                </div>
                <p class="text-center mt-2 mb-0"><strong>{{ leftName() }}</strong><br><small class="text-muted">{{ leftParty() }}</small><br><small>{{ leftVotes().toLocaleString() }} votos</small></p>
              </div>
              <div class="col-md-6">
                <div class="chart-canvas-wrapper">
                  <canvas id="chartB"></canvas>
                </div>
                <p class="text-center mt-2 mb-0"><strong>{{ rightName() }}</strong><br><small class="text-muted">{{ rightParty() }}</small><br><small>{{ rightVotes().toLocaleString() }} votos</small></p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
